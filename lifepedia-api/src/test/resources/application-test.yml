# Perfil de testes (banco via Testcontainers).
lifepedia:
  storage:
    dir: ${java.io.tmpdir}/lifepedia-test-uploads
  jwt:
    secret: test-only-secret-0123456789abcdef-0123456789
  auth:
    # Muitos cadastros do mesmo IP.
    ip-limit: 10000
  # Os testes chamam os agendamentos direto (TaskOverdueJob.notifyOverdue, TaskReminderJob.remind).
  scheduling:
    enabled: false
  admin:
    email: admin-fixo@lifepedia.dev
  # Espaço pequeno para testar o limite com arquivos de teste.
  architecture:
    quota: 1MB
    max-model: 600KB
  # Chave só de teste (32 bytes). Os clientes dos serviços externos são mocks nos testes.
  integrations:
    key: dGVzdC1vbmx5LWtleS0wMTIzNDU2Nzg5YWJjZGVmMDE=
    app-url: http://localhost:5173
