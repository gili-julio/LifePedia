name: API

on:
  push:
    branches: [main]
    paths:
      - "lifepedia-api/**"
      - "!lifepedia-api/**/*.md"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "lifepedia-api/**"
      - "!lifepedia-api/**/*.md"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lifepedia-api

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp checkstyle:check

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers usa o Docker que já vem no runner.
      - run: ./mvnw -B -ntp test

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: lifepedia-api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
