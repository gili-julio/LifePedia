<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sem conexão · LifePedia</title>
    <style>
      :root { --bg: #f7f7f5; --fg: #171717; --muted: #6b6b6b; --btn: #171717; --btn-fg: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #070707; --fg: #ededed; --muted: #a1a1a1; --btn: #ededed; --btn-fg: #171717; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 22rem; text-align: center; }
      img { width: 48px; height: 48px; }
      h1 { margin: 16px 0 8px; font-size: 1.25rem; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      button {
        border: 0; border-radius: 999px; padding: 10px 20px; font: inherit; font-weight: 600;
        background: var(--btn); color: var(--btn-fg); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Sem conexão</h1>
      <p>O LifePedia precisa de internet para mostrar seus dados. Assim que a conexão voltar, a página abre sozinha.</p>
      <button id="retry" type="button">Tentar de novo</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
